# Pages source: GitHub Actions
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Install Chromium for visual QA
        run: npx playwright install --with-deps chromium
      - name: Run 30-scenario visual QA
        run: npm run qa:e2e
      - name: Upload 30-feature QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-30-screenshots
          path: |
            test-results/qa
            playwright-report
            docs/qa-30-feature-matrix.md
          if-no-files-found: warn
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
